<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmation - CurioCrow</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/Navbar.css">
<link rel="stylesheet" href="../css/Footer.css">
<link rel="stylesheet" href="../css/ConfirmedPage.css">
</head>
<body>

<!-- Navbar -->
<div id="navbar"></div>

<div class="confirmation-page">
  <div class="header-content">
    <h1>Order Placed!</h1>
    <p>Thank you for your purchase! Your order has been successfully placed.</p>
  </div>


  <div class="confirmation-container">
    <div class="order-summary">
      <h2>Coins Ordered</h2>
      <div id="orderList"></div>
      <h3 id="orderTotal"></h3>
    </div>

    <div class="shipping-info">
      <h2>Shipping Information</h2>
      <div id="shippingDetails"></div>
    </div>
  </div>

  <a href="../pages/home.html" class="btn home-btn">Return to Home</a>
</div>

<!-- Footer -->
<div id="footer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAvgqnAgdSQeGpgTMRMOvcaxB7fD8XbETk",
  authDomain: "curiocrow.firebaseapp.com",
  projectId: "curiocrow",
  storageBucket: "curiocrow.appspot.com",
  messagingSenderId: "570380745141",
  appId: "1:570380745141:web:9df2526ec09b3f634e41fc"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---------- Navbar & Footer ----------
fetch('../components/navbar.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('navbar').innerHTML = html;
    setupNavbar(); // attach dropdown + search functionality
  });

fetch('../components/footer.html')
  .then(res => res.text())
  .then(html => document.getElementById('footer').innerHTML = html);

// Setup navbar: profile dropdown + search bar
function setupNavbar() {
  const profileIcon = document.getElementById('profileIcon');
  const dropdownMenu = document.querySelector('.dropdown-menu');
  const searchForm = document.getElementById('searchForm');
  const searchInput = document.getElementById('searchInput');

  if (!profileIcon || !dropdownMenu || !searchForm || !searchInput) return;

  // Profile dropdown
  profileIcon.addEventListener('click', e => {
    e.stopPropagation();
    dropdownMenu.classList.toggle('show');
  });
  dropdownMenu.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => dropdownMenu.classList.remove('show'));

  // Firebase auth
  onAuthStateChanged(auth, user => {
    dropdownMenu.innerHTML = '';
    if (user) {
      profileIcon.src = user.photoURL || '../assets/UserIcon.png';
      dropdownMenu.innerHTML = `
        <a href="../pages/profile.html" class="dropdown-item">Profile</a>
        <button class="btn dropdown-item" id="logoutBtn">Logout</button>
      `;
      const logoutBtn = dropdownMenu.querySelector('#logoutBtn');
      logoutBtn.addEventListener('click', async () => {
        try {
          await signOut(auth);
          localStorage.clear();
          window.location.href = "../index.html";
        } catch (err) {
          console.error("Logout failed:", err);
          alert("Failed to log out. Try again.");
        }
      });
    } else {
      profileIcon.src = '../assets/UserIcon.png';
      dropdownMenu.innerHTML = `<a href="../pages/login.html" class="dropdown-item">Login</a>`;
    }
  });

  // Search bar
  searchForm.addEventListener('submit', e => {
    e.preventDefault();
    const query = searchInput.value.trim();
    if (!query) return;
    window.location.href = `../pages/coins.html?search=${encodeURIComponent(query)}`;
  });
}

// ---------- Order Confirmation ----------
const orderList = document.getElementById('orderList');
const orderTotal = document.getElementById('orderTotal');
const shippingDetails = document.getElementById('shippingDetails');

function renderConfirmation(cart, shipping) {
  orderList.innerHTML = '';
  shippingDetails.innerHTML = '';

  if (cart.length === 0) {
    orderList.innerHTML = '<p>No items found in your order.</p>';
    orderTotal.textContent = '';
  } else {
    let total = 0;
    cart.forEach(coin => {
      const item = document.createElement('div');
      item.className = 'cart-item';
      item.innerHTML = `
        <img src="${coin.img || 'coin.png'}" alt="${coin.Name}">
        <div class="cart-item-details">
          <h4>${coin.Name} ${coin.quantity > 1 ? '×'+coin.quantity : ''}</h4>
          <p>${coin.Country}</p>
          <p>${coin.FaceValue} ${coin.Currency || 'USD'}</p>
        </div>
      `;
      orderList.appendChild(item);
      total += (coin.FaceValue || 0) * (coin.quantity || 1);
    });
    orderTotal.textContent = `Total: ${total} ${cart[0]?.Currency || 'USD'}`;
  }

  // Shipping info (exclude payment)
  const excludedFields = ["Cardname","Cardnumber","Expiry","Cvv"];
  for (const [key, value] of Object.entries(shipping)) {
    if (!excludedFields.includes(key)) {
      const p = document.createElement('p');
      p.textContent = `${key.replace(/([A-Z])/g, ' $1')}: ${value}`;
      shippingDetails.appendChild(p);
    }
  }
}

async function saveOrderToFirestore(cart, shipping, userEmail) {
  try {
    const { CardName, CardNumber, Expiry, Cvv, ...safeShipping } = shipping;
    await addDoc(collection(db, "orders"), {
      userEmail,
      items: cart,
      shipping: safeShipping,
      createdAt: serverTimestamp()
    });
  } catch (err) {
    console.error("Failed to save order:", err);
  }
}

// Main
onAuthStateChanged(auth, async user => {
  if (!user) {
    document.body.innerHTML = '<p class="not-logged-in" style="text-align:center; margin-top:50px;">Please log in to view your order.</p>';
    return;
  }

  const cart = JSON.parse(localStorage.getItem('checkoutCart')) || [];
  const shipping = JSON.parse(localStorage.getItem('checkoutShipping')) || {};

  renderConfirmation(cart, shipping);
  await saveOrderToFirestore(cart, shipping, user.email);

  localStorage.removeItem('checkoutCart');
  localStorage.removeItem('checkoutShipping');
  localStorage.removeItem('cart');
});
</script>

</body>
</html>
