<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Details - CurioCrow</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/Navbar.css">
<link rel="stylesheet" href="../css/Footer.css">
<style>
  .order-page { padding: 2rem; }
  .order-item { display: flex; align-items: center; margin-bottom: 1rem; }
  .order-item img { width: 50px; height: 50px; object-fit: contain; margin-right: 1rem; }

  .order-pipeline {
    display: flex;
    gap: 0;
    margin-top: 2rem;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }

  .pipeline-step {
    text-align: center;
    flex: 1;
    position: relative;
  }

  .pipeline-step .circle {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    margin: 0 auto 5px;
    z-index: 1;
    position: relative;
  }

  .completed .circle { background: green; }
  .current .circle { background: orange; }
  .pending .circle { background: lightgray; }

  /* connector lines between steps */
  .pipeline-step::after {
    content: "";
    position: absolute;
    top: 12px; /* center with circle */
    left: 50%;
    width: 100%;
    height: 3px;
    background: lightgray;
    z-index: 0;
  }

  .pipeline-step.completed::after {
    background: green;
  }

  .pipeline-step:last-child::after {
    display: none;
  }
</style>
</head>
<body>

<div id="navbar"></div>

<div class="order-page">
  <h1>Order Details</h1>
  <p id="orderDate"></p>
  <div id="orderItems"></div>

  <h2>Order Pipeline</h2>
  <div class="order-pipeline">
    <div class="pipeline-step completed">
      <div class="circle"></div>
      <div>Confirmed</div>
    </div>
    <div class="pipeline-step current">
      <div class="circle"></div>
      <div>Shipment</div>
    </div>
    <div class="pipeline-step pending">
      <div class="circle"></div>
      <div>Delivery <span id="eta"></span></div>
    </div>
  </div>
</div>

<div id="footer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvgqnAgdSQeGpgTMRMOvcaxB7fD8XbETk",
  authDomain: "curiocrow.firebaseapp.com",
  projectId: "curiocrow",
  storageBucket: "curiocrow.appspot.com",
  messagingSenderId: "570380745141",
  appId: "1:570380745141:web:9df2526ec09b3f634e41fc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Navbar & Footer
fetch('../components/navbar.html').then(r => r.text()).then(html => document.getElementById('navbar').innerHTML = html);
fetch('../components/footer.html').then(r => r.text()).then(html => document.getElementById('footer').innerHTML = html);

// Get orderId from URL
function getOrderIdFromURL() {
  return new URLSearchParams(window.location.search).get('id');
}

// Load order data
async function loadOrder() {
  const orderId = getOrderIdFromURL();
  if (!orderId) return alert("Order ID missing");

  const orderRef = doc(db, "orders", orderId);
  const orderSnap = await getDoc(orderRef);
  if (!orderSnap.exists()) return alert("Order not found");

  const order = orderSnap.data();
  document.getElementById('orderDate').textContent = `Order Date: ${order.createdAt?.toDate().toLocaleString() || "Unknown"}`;

  const itemsDiv = document.getElementById('orderItems');
  itemsDiv.innerHTML = order.items.map(item => `
    <div class="order-item">
      <img src="${item.img || '../assets/coin.png'}" alt="${item.Name}">
      <div>
        <strong>${item.Name}</strong> × ${item.quantity || 1}<br>
        ${item.FaceValue} ${item.Currency || ""}
      </div>
    </div>
  `).join("");

  // Random ETA 5–12 days
  const etaDays = Math.floor(Math.random() * 8) + 5;
  document.getElementById('eta').textContent = `(ETA ${etaDays} days)`;
}

loadOrder();
</script>

</body>
</html>
