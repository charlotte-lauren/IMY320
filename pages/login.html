<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Register - CurioCrow</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/Navbar.css">
<link rel="stylesheet" href="../css/Footer.css">
<link rel="stylesheet" href="../css/LoginPage.css">
<style>
  .password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .toggle-password {
    position: absolute;
    right: 10px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    color: #666;
  }
  .toggle-password:hover {
    color: #222;
  }
</style>
</head>
<body>
<div id="navbar"></div>

<div class="container">
  <form id="loginForm" novalidate>
    <h2>Welcome</h2>
    <p class="subheading" id="subheading">Log in to continue</p>

    <div class="floating-label">
      <input type="email" id="email" placeholder="Email">
      <label for="email">Email</label>
      <p class="feedback" id="emailError"></p>
    </div>

    <div class="floating-label" id="usernameField" style="display:none;">
      <input type="text" id="username" placeholder="Username (optional)">
      <label for="username">Username</label>
      <p class="feedback" id="usernameError"></p>
    </div>

    <div class="floating-label">
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Password">
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show or hide password">👁️</button>
      </div>
      <label for="password">Password
        <span class="coin-tooltip" id="passwordCoins" style="display:none;">
          <span id="coinDisplay">🪙🪙🪙🪙</span>
          <span class="tooltip-text">
            Earn coins for: 1 uppercase letter, 1 number, 1 special character, and length &gt; 8
          </span>
        </span>
      </label>
      <p class="feedback" id="passwordError"></p>
    </div>

    <div class="floating-label" id="confirmField" style="display:none;">
      <div class="password-wrapper">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
        <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Show or hide confirm password">👁️</button>
      </div>
      <label for="confirmPassword">Confirm Password
        <span class="coin-tooltip" id="confirmCoins" style="display:none;">
          <span id="confirmCoinDisplay">🪙🪙🪙🪙</span>
          <span class="tooltip-text">Coins shown only if password matches and earns same rewards</span>
        </span>
      </label>
      <p class="feedback" id="confirmError"></p>
    </div>

    <div class="signin-row" id="staySignedRow">
      <label class="stay-signed-in">
        <input type="checkbox" id="staySignedIn"> Stay signed in
      </label>
    </div>

    <button type="submit" class="btn btn-login" id="submitBtn">Log In</button>
    <div class="register-link" id="toggleLink">
      <p>Don't have an account? <a href="#" id="toggleMode">Register here</a></p>
    </div>
    <p id="message" style="text-align:center; margin-top:10px;"></p>
  </form>
</div>

<div id="footer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { 
  getAuth, 
  setPersistence, 
  browserLocalPersistence,
  createUserWithEmailAndPassword, 
  signInWithEmailAndPassword, 
  updateProfile 
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvgqnAgdSQeGpgTMRMOvcaxB7fD8XbETk",
  authDomain: "curiocrow.firebaseapp.com",
  projectId: "curiocrow",
  storageBucket: "curiocrow.firebasestorage.app",
  messagingSenderId: "570380745141",
  appId: "1:570380745141:web:9df2526ec09b3f634e41fc"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence);

// Navbar + Footer
fetch('../components/navbar.html').then(r => r.text()).then(html => {
  document.getElementById('navbar').innerHTML = html;
});
fetch('../components/footer.html').then(r => r.text()).then(html => {
  document.getElementById('footer').innerHTML = html;
});

const coinEmoji = '🪙';
let isRegister = false;

const loginForm = document.getElementById('loginForm');
const emailEl = document.getElementById('email');
const passwordEl = document.getElementById('password');
const usernameEl = document.getElementById('username');
const confirmEl = document.getElementById('confirmPassword');
const usernameField = document.getElementById('usernameField');
const confirmField = document.getElementById('confirmField');
const subheading = document.getElementById('subheading');
const submitBtn = document.getElementById('submitBtn');
const toggleMode = document.getElementById('toggleMode');
const messageEl = document.getElementById('message');
const passwordCoins = document.getElementById('passwordCoins');
const coinDisplay = document.getElementById('coinDisplay');
const confirmCoins = document.getElementById('confirmCoins');
const confirmCoinDisplay = document.getElementById('confirmCoinDisplay');

// Password show/hide functionality
const togglePassword = document.getElementById('togglePassword');
const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');

togglePassword.addEventListener('click', () => {
  const type = passwordEl.type === 'password' ? 'text' : 'password';
  passwordEl.type = type;
  togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
});

toggleConfirmPassword.addEventListener('click', () => {
  const type = confirmEl.type === 'password' ? 'text' : 'password';
  confirmEl.type = type;
  toggleConfirmPassword.textContent = type === 'password' ? '👁️' : '🙈';
});

function getPasswordScore(password) {
  let score = 0;
  if (/[A-Z]/.test(password)) score++;
  if (/[0-9]/.test(password)) score++;
  if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) score++;
  if (password.length > 8) score++;
  return score;
}
function updateCoins() {
  if (!isRegister) return;
  const score = getPasswordScore(passwordEl.value);
  coinDisplay.textContent = coinEmoji.repeat(score);
  passwordCoins.style.display = 'inline-block';

  if (passwordEl.value && confirmEl.value && passwordEl.value === confirmEl.value) {
    confirmCoinDisplay.textContent = coinEmoji.repeat(score);
    confirmCoins.style.display = 'inline-block';
  } else {
    confirmCoinDisplay.textContent = '';
    confirmCoins.style.display = 'none';
  }
}
passwordEl.addEventListener('input', updateCoins);
confirmEl.addEventListener('input', updateCoins);

function toggleRegister() {
  isRegister = !isRegister;
  usernameField.style.display = isRegister ? 'block' : 'none';
  confirmField.style.display = isRegister ? 'block' : 'none';
  subheading.textContent = isRegister ? 'Register to continue' : 'Log in to continue';
  submitBtn.textContent = isRegister ? 'Register' : 'Log In';
  toggleMode.textContent = isRegister ? 'Login here' : 'Register here';
  messageEl.textContent = '';
  passwordCoins.style.display = 'none';
  confirmCoins.style.display = 'none';
}
toggleMode.addEventListener('click', e => { e.preventDefault(); toggleRegister(); });

loginForm.addEventListener('submit', async e => {
  e.preventDefault();
  messageEl.textContent = '';

  const email = emailEl.value.trim();
  const password = passwordEl.value;

  if (!email || !password) {
    messageEl.style.color = '#f28028';
    messageEl.textContent = 'Email and password are required.';
    return;
  }

  try {
    if (isRegister) {
      if (password !== confirmEl.value) {
        messageEl.style.color = '#f28028';
        messageEl.textContent = 'Passwords do not match.';
        return;
      }
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(userCredential.user, {
        displayName: usernameEl.value.trim() || 'User'
      });
      messageEl.style.color = '#7DA0AE';
      messageEl.textContent = `Registered as ${usernameEl.value.trim() || email}`;
    } else {
      await signInWithEmailAndPassword(auth, email, password);
      messageEl.style.color = '#7DA0AE';
      messageEl.textContent = `Logged in as ${email}`;
    }

    setTimeout(() => {
      window.location.href = "../pages/home.html";
    }, 1000);

  } catch (error) {
    messageEl.style.color = '#f28028';
    messageEl.textContent = error.message;
  }
});
</script>
</body>
</html>
