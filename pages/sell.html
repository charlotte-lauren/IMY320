<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Page - CurioCrow</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/Navbar.css">
  <link rel="stylesheet" href="../css/Footer.css">
  <link rel="stylesheet" href="../css/SellerPage.css">
  <style>
    /* Popup Notification */
    .popup-notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #333;
      color: #fff;
      padding: 12px 20px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 9999;
      transform: translateY(-20px);
      font-family: sans-serif;
      font-size: 14px;
    }
    .popup-notification.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <div class="seller-page">
    <h1>Seller Page</h1>
    <div id="content">
      <p>Loading...</p>
    </div>
  </div>

  <!-- Popup Notification -->
  <div id="popup-notification" class="popup-notification"></div>

  <!-- Footer -->
  <div id="footer"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAvgqnAgdSQeGpgTMRMOvcaxB7fD8XbETk",
      authDomain: "curiocrow.firebaseapp.com",
      projectId: "curiocrow",
      storageBucket: "curiocrow.appspot.com",
      messagingSenderId: "570380745141",
      appId: "1:570380745141:web:9df2526ec09b3f634e41fc"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const contentEl = document.getElementById("content");

    // ---------------- Popup Function ----------------
    function showPopup(message, duration = 2000) {
      const popup = document.getElementById('popup-notification');
      popup.textContent = message;
      popup.classList.add('show');
      setTimeout(() => popup.classList.remove('show'), duration);
    }

    // ---------------- Navbar & Footer ----------------
    fetch('../components/navbar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('navbar').innerHTML = html;

        const userDropdown = document.querySelector('.user-dropdown');
        const dropdownMenu = userDropdown.querySelector('.dropdown-menu');
        const profileIcon = userDropdown.querySelector('.profile-icon');

        profileIcon.addEventListener('click', e => {
          e.stopPropagation();
          dropdownMenu.classList.toggle('show');
        });
        dropdownMenu.addEventListener('click', e => e.stopPropagation());
        document.addEventListener('click', () => dropdownMenu.classList.remove('show'));

        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        if (searchForm && searchInput) {
          searchForm.addEventListener('submit', e => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;
            window.location.href = `../pages/coins.html?search=${encodeURIComponent(query)}`;
          });
        }

        onAuthStateChanged(auth, async (user) => {
          dropdownMenu.innerHTML = '';
          if (user) {
            profileIcon.src = user.photoURL || '../assets/UserIcon.png';
            dropdownMenu.innerHTML = `
              <a href="../pages/profile.html" class="dropdown-item dropdown-item-profile">Profile</a>
              <button class="btn dropdown-item" id="logoutBtn">Logout</button>
            `;
            dropdownMenu.querySelector('#logoutBtn').addEventListener('click', async () => {
              await signOut(auth);
              window.location.href = "../index.html";
            });

            renderPage(user);
          } else {
            profileIcon.src = '../assets/UserIcon.png';
            dropdownMenu.innerHTML = `<a href="../pages/login.html" class="dropdown-item dropdown-item-profile">Login</a>`;
            contentEl.innerHTML = `<p class="not-logged-in">Please log in to access this page.</p>`;
          }
        });

        const currentPath = window.location.pathname.split("/").pop(); // e.g., "home.html"
      document.querySelectorAll(".navbar-bottom .nav-link").forEach(link => {
        const linkPath = link.getAttribute("href").split("/").pop();
        if (linkPath === currentPath) {
          console.log("Active link set:", linkPath);
          link.classList.add("active");
        } else {
          link.classList.remove("active");
        }
      });
      })
      .catch(err => console.error('Error loading navbar:', err));

    fetch('../components/footer.html')
      .then(res => res.text())
      .then(html => document.getElementById('footer').innerHTML = html)
      .catch(err => console.error('Error loading footer:', err));

    // ---------------- Seller Page Render ----------------
    function renderPage(user) {
      // contentEl.innerHTML = `
      //   <div class="seller-inputs">
      //     <h2 style="font-size:24px;">Add a Coin</h2>
      //     <h3 style="font-size:18px; color: #305F72;">Basic Info</h3>
      //     <input placeholder="Name" id="coinName">
      //     <input placeholder="Country" id="coinCountry">
      //     <input placeholder="Description" id="coinDescription">
      //     <input placeholder="Issued On" id="coinIssuedOn">
      //     <br>
      //     <h3 style="font-size:18px; color: #305F72;">Currency & Cost</h3>
      //     <input placeholder="FaceValue" id="coinFaceValue">
      //     <input placeholder="Currency" id="coinCurrency">
      //     <input placeholder="Series" id="coinSeries">
      //     <br>
      //     <h3 style="font-size:18px; color: #305F72;">Appearance</h3>
      //     <input placeholder="Shape" id="coinShape">
      //     <input placeholder="Metal Composition (separate metals with commas)" id="coinMetal">
      //     <input placeholder="Link" id="coinLink">
      //     <br>
      //     <button class="btn" id="addCoinBtn" style="margin: 1rem 0 0 auto;">Add Coin</button>
      //   </div?
      // `;
      contentEl.innerHTML = `
        <div class="seller-inputs">
          <h2 style="font-size:24px;">Add a Coin</h2>

          <h3 style="font-size:18px; color: #305F72; margin-bottom: 1.5rem;">Basic Info</h3>
          <div class="floating-label">
            <input id="coinName" type="text" required>
            <label for="coinName">Name</label>
          </div>
          <div class="floating-label">
            <input id="coinCountry" type="text" required>
            <label for="coinCountry">Country</label>
          </div>
          <div class="floating-label">
            <input id="coinDescription" type="text" required>
            <label for="coinDescription">Description</label>
          </div>
          <div class="floating-label">
            <input id="coinIssuedOn" type="text" required>
            <label for="coinIssuedOn">Issued On</label>
          </div>

          <h3 style="font-size:18px; color: #305F72; margin-bottom: 1.5rem;">Currency & Cost</h3>
          <div class="floating-label">
            <input id="coinFaceValue" type="text" required>
            <label for="coinFaceValue">Face Value</label>
          </div>
          <div class="floating-label">
            <input id="coinCurrency" type="text" required>
            <label for="coinCurrency">Currency</label>
          </div>
          <div class="floating-label">
            <input id="coinSeries" type="text" required>
            <label for="coinSeries">Series</label>
          </div>

          <h3 style="font-size:18px; color: #305F72; margin-bottom: 1.5rem;">Appearance</h3>
          <div class="floating-label">
            <input id="coinShape" type="text" required>
            <label for="coinShape">Shape</label>
          </div>
          <div class="floating-label">
            <input id="coinMetal" type="text" required>
            <label for="coinMetal">Metal Composition (separate with commas)</label>
          </div>
          <div class="floating-label">
            <input id="coinLink" type="text" required>
            <label for="coinLink">Link</label>
          </div>

          <button class="btn" id="addCoinBtn" style="margin: 1rem 0 0 auto;">Add Coin</button>
        </div>
      `;


      const form = {
        Name: "",
        Country: "",
        FaceValue: "",
        Currency: "",
        Series: "",
        Shape: "",
        MetalComposition: "",
        Link: "",
        IssuedOn: "",
        Description: ""
      };

      // Input listeners
      document.getElementById("coinName").addEventListener("input", e => form.Name = e.target.value);
      document.getElementById("coinCountry").addEventListener("input", e => form.Country = e.target.value);
      document.getElementById("coinFaceValue").addEventListener("input", e => form.FaceValue = e.target.value);
      document.getElementById("coinCurrency").addEventListener("input", e => form.Currency = e.target.value);
      document.getElementById("coinSeries").addEventListener("input", e => form.Series = e.target.value);
      document.getElementById("coinShape").addEventListener("input", e => form.Shape = e.target.value);
      document.getElementById("coinMetal").addEventListener("input", e => form.MetalComposition = e.target.value);
      document.getElementById("coinLink").addEventListener("input", e => form.Link = e.target.value);
      document.getElementById("coinIssuedOn").addEventListener("input", e => form.IssuedOn = e.target.value);
      document.getElementById("coinDescription").addEventListener("input", e => form.Description = e.target.value);

      // Add Coin button
      document.getElementById("addCoinBtn").addEventListener("click", async () => {
        try {
          const metalsArray = form.MetalComposition.split(',').map(m => m.trim()).filter(m => m);
          await addDoc(collection(db, "coins"), {
            Name: form.Name,
            Country: form.Country,
            FaceValue: form.FaceValue,
            Currency: form.Currency,
            Series: form.Series,
            Shape: form.Shape,
            MetalComposition: metalsArray,
            Link: form.Link,
            IssuedOn: Number(form.IssuedOn),
            Description: form.Description,
            createdBy: user.uid,
            createdAt: serverTimestamp()
          });

          showPopup("Coin added successfully!");  // <- Popup notification
          document.querySelectorAll('input').forEach(input => input.value = '');
        } catch (err) {
          console.error(err);
          showPopup("Failed to add coin.");
        }
      });
    }
  </script>

</body>
</html>
