<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - CurioCrow</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/Navbar.css">
<link rel="stylesheet" href="../css/Footer.css">
<link rel="stylesheet" href="../css/ProfilePage.css">
<style>
  .avatar-options { display: flex; gap: 0.5rem 1rem; margin-top: 1rem; margin-bottom: 1rem; flex-wrap: wrap; flex-direction: row;  align-items: center; justify-content: center;}
  .avatar-choice { width: calc(5rem + 1vw); height: calc(5rem + 1vw); border-radius: 999px; cursor: pointer; border: 2px solid transparent; object-fit: cover; transition: border 0.2s; }
  .avatar-choice.selected { filter: drop-shadow(0px 5px 10px #b873328a); }
  .avatar-choice:hover { transform: scale(1.05); transition: transform 0.2s ease-in-out; }
  .orders { margin-top: 2rem; }
  .order-items { margin-top: 0.5rem; }
  .order-item { display: flex; align-items: center; margin-bottom: 0.5rem; }
  .order-item img { width: 50px; height: 50px; object-fit: contain; margin-right: 0.75rem; border-radius: 999px; }

  /* Popup Notification */
  .popup-notification {
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: #333;
    color: #fff;
    padding: 12px 20px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 9999;
    transform: translateY(-20px);
    font-family: sans-serif;
    font-size: 14px;
  }
  .popup-notification.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
</style>
</head>
<body>

<!-- Navbar -->
<div id="navbar"></div>

<div class="profile-page">
  <section class="profile-header">
    <div class="profile-display">
      <img src="../assets/coin.png" alt="User" class="profile-avatar" id="profileAvatar">
      <h1 class="profile-username" id="profileUsername">User</h1>
    </div>
    <button class="profile-btn" id="editProfileBtn">Edit Profile</button>
  </section>

  <!-- Edit profile form -->
  <section class="profile-edit" id="profileEdit" style="display:none;">
    <label>Username:
      <input type="text" id="usernameInput">
    </label>
    <label>Select Avatar:
      <div id="avatarOptions" class="avatar-options">
        <img src="../assets/avatars/avatar1.png" class="avatar-choice" data-url="../assets/avatars/avatar1.png">
        <img src="../assets/avatars/avatar2.png" class="avatar-choice" data-url="../assets/avatars/avatar2.png">
        <img src="../assets/avatars/avatar3.png" class="avatar-choice" data-url="../assets/avatars/avatar3.png">
        <img src="../assets/avatars/avatar4.png" class="avatar-choice" data-url="../assets/avatars/avatar4.png">
        <img src="../assets/avatars/avatar5.png" class="avatar-choice" data-url="../assets/avatars/avatar5.png">
        <img src="../assets/avatars/avatar6.png" class="avatar-choice" data-url="../assets/avatars/avatar6.png">
      </div>
    </label>
    <div class="profile-btns">
      <button class=" btn btn-secondary" id="cancelEditBtn">Cancel</button>
      <button class="btn btn-primary" id="saveProfileBtn">Save</button>
    </div>
  </section>

  <!-- Wishlist -->
  <section class="wishlist">
    <h2>Wishlist</h2>
    <div class="wishlist-grid" id="wishlistGrid"></div>
  </section>

  <!-- Orders -->
  <section class="orders">
    <h2>Your Orders</h2>
    <div id="ordersList"><p>Loading your orders...</p></div>
  </section>
</div>

<!-- Popup Notification -->
<div id="popup-notification" class="popup-notification"></div>

<!-- Footer -->
<div id="footer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, orderBy, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvgqnAgdSQeGpgTMRMOvcaxB7fD8XbETk",
  authDomain: "curiocrow.firebaseapp.com",
  projectId: "curiocrow",
  storageBucket: "curiocrow.appspot.com",
  messagingSenderId: "570380745141",
  appId: "1:570380745141:web:9df2526ec09b3f634e41fc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---------------- Popup Function ----------------
function showPopup(message, duration = 2000) {
  const popup = document.getElementById('popup-notification');
  popup.textContent = message;
  popup.classList.add('show');
  setTimeout(() => popup.classList.remove('show'), duration);
}

// ---------------- Navbar ----------------
fetch('../components/navbar.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('navbar').innerHTML = html;
    const userDropdown = document.querySelector('.user-dropdown');
    const dropdownMenu = userDropdown.querySelector('.dropdown-menu');
    const profileIcon = userDropdown.querySelector('.profile-icon');
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');

    if (!userDropdown || !dropdownMenu || !profileIcon || !searchForm || !searchInput) 
      return console.error('Navbar elements missing');

    profileIcon.addEventListener('click', e => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('show');
    });
    dropdownMenu.addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => dropdownMenu.classList.remove('show'));

    onAuthStateChanged(auth, (user) => {
      dropdownMenu.innerHTML = '';
      if (user) {
        profileIcon.src = user.photoURL || '../assets/UserIcon.png';
        dropdownMenu.innerHTML = `
          <a href="profile.html" class="dropdown-item dropdown-item-profile">Profile</a>
          <button class="btn dropdown-item" id="logoutBtn">Logout</button>
        `;
        const logoutBtn = dropdownMenu.querySelector('#logoutBtn');
        logoutBtn.addEventListener('click', async () => {
          try {
            await signOut(auth);
            window.location.href = "../index.html";
          } catch (err) {
            console.error("Logout failed:", err);
            showPopup("Failed to log out. Try again.");
          }
        });
      } else {
        profileIcon.src = '../assets/UserIcon.png';
        dropdownMenu.innerHTML = `<a href="login.html" class="dropdown-item dropdown-item-profile">Login</a>`;
      }
    });

    searchForm.addEventListener('submit', e => {
      e.preventDefault();
      const query = searchInput.value.trim();
      if (!query) return;
      window.location.href = `../pages/coins.html?search=${encodeURIComponent(query)}`;
    });
  });

// ---------------- Footer ----------------
fetch('../components/footer.html')
  .then(r => r.text())
  .then(html => document.getElementById('footer').innerHTML = html);

// ---------------- Profile Logic ----------------
const profileUsername = document.getElementById('profileUsername');
const profileAvatar = document.getElementById('profileAvatar');
const wishlistGrid = document.getElementById('wishlistGrid');
const editProfileBtn = document.getElementById('editProfileBtn');
const profileEdit = document.getElementById('profileEdit');
const usernameInput = document.getElementById('usernameInput');
const saveProfileBtn = document.getElementById('saveProfileBtn');
const cancelEditBtn = document.getElementById('cancelEditBtn');
const avatarChoices = document.querySelectorAll('.avatar-choice');
const ordersList = document.getElementById('ordersList');

let currentUser;
let selectedAvatar = null;

onAuthStateChanged(auth, async user => {
  if (!user) {
    document.body.innerHTML = '<p class="not-logged-in" style="text-align:center; margin-top:50px;">Please log in to view your profile.</p>';
    return;
  }

  currentUser = user;
  profileUsername.textContent = user.displayName || "User";
  profileAvatar.src = user.photoURL || '../assets/coin.png';
  usernameInput.value = user.displayName || "";

  // Wishlist
  async function renderWishlist() {
    wishlistGrid.innerHTML = '<p>Loading wishlist...</p>';
    try {
      const wishlistQuery = query(collection(db, "wishlist"), where("userEmail", "==", user.email));
      const wishlistSnap = await getDocs(wishlistQuery);

      if (wishlistSnap.empty) {
        wishlistGrid.innerHTML = '<p class="not-logged-in" style="text-align:center;">Your wishlist is empty.</p>';
        return;
      }

      wishlistGrid.innerHTML = '';
      for (const docSnap of wishlistSnap.docs) {
        const wishlistItem = docSnap.data();
        const coinRef = doc(db, "coins", wishlistItem.coinId);
        const coinSnap = await getDoc(coinRef);
        if (!coinSnap.exists()) continue;
        const coin = coinSnap.data();

        const card = document.createElement('div');
        card.className = 'wishlist-card';
        card.innerHTML = `
          <img src="${coin.Link || '../assets/coin.png'}" alt="${coin.Name}" class="wishlist-img">
          <div class="wishlist-info">
            <h3>${coin.Name}</h3>
            <p>${coin.Country} ${coin.IssuedOn ? '('+coin.IssuedOn+')' : ''}</p>
            <div class="wishlist-price">${coin.FaceValue ? coin.FaceValue+' '+(coin.Currency || 'USD') : 'N/A'}</div>
            <div class="wishlist-actions">
              <a href="product.html?id=${docSnap.data().coinId}" class="profile-btn">View</a>
              <button class="profile-btn profile-btn-secondary">Remove</button>
            </div>
          </div>
        `;
        card.querySelector('.profile-btn-secondary').addEventListener('click', async () => {
          try {
            await deleteDoc(doc(db, "wishlist", docSnap.id));
            showPopup("Item removed from wishlist!");
            renderWishlist();
          } catch (err) {
            console.error("Failed to remove from wishlist:", err);
            showPopup("Failed to remove item.");
          }
        });
        wishlistGrid.appendChild(card);
      }
    } catch (err) {
      console.error("Error loading wishlist:", err);
      wishlistGrid.innerHTML = '<p>Failed to load wishlist.</p>';
    }
  }

  renderWishlist();

  // Orders
  try {
    const q = query(collection(db, "orders"), where("userEmail", "==", user.email), orderBy("createdAt", "desc"));
    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      ordersList.innerHTML = `<p class="not-logged-in">You have no orders yet.</p>`;
    } else {
      ordersList.innerHTML = "";
      snapshot.forEach(doc => {
        const order = doc.data();
        const orderDiv = document.createElement('div');
        orderDiv.className = "order-card";
        orderDiv.innerHTML = `
          <div class="order-items">
            <h3 class="order-time">Order on ${order.createdAt?.toDate().toLocaleString() || "Unknown date"}</h3>

            ${order.items.map(item => `
              <div class="order-item">
                <img src="${item.img || '../assets/coin.png'}" alt="${item.Name}">
                <div>
                  <strong>${item.Name}</strong> × ${item.quantity || 1}<br>
                  ${item.FaceValue} ${item.Currency || ""}
                </div>
              </div>
            `).join("")}
          </div>
          <a href="order.html?id=${doc.id}" class="profile-btn">View Order</a>
        `;
        ordersList.appendChild(orderDiv);
      });
    }
  } catch (err) {
    console.error("Error fetching orders:", err);
    ordersList.innerHTML = "<p>Failed to load your orders.</p>";
  }
});

// ---------------- Edit Profile ----------------
editProfileBtn.addEventListener('click', () => profileEdit.style.display = 'flex');
cancelEditBtn.addEventListener('click', () => profileEdit.style.display = 'none');

avatarChoices.forEach(img => {
  img.addEventListener('click', () => {
    avatarChoices.forEach(i => i.classList.remove('selected'));
    img.classList.add('selected');
    selectedAvatar = img.dataset.url;
  });
});

saveProfileBtn.addEventListener('click', async () => {
  if (!currentUser) return;
  const photoURL = selectedAvatar || currentUser.photoURL || '../assets/coin.png';
  try {
    await updateProfile(currentUser, { displayName: usernameInput.value, photoURL });
    profileUsername.textContent = usernameInput.value;
    profileAvatar.src = photoURL;
    profileEdit.style.display = 'none';
    showPopup("Profile updated!"); // <- popup instead of alert
  } catch (err) {
    console.error(err);
    showPopup("Failed to update profile.");
  }
});
</script>
</body>
</html>
