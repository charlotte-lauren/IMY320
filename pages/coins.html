<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coins Directory - CurioCrow</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/CoinsDirectory.css">
  <link rel="stylesheet" href="../css/Navbar.css">
  <link rel="stylesheet" href="../css/Footer.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #F2EFED;
      color: #1A1F2B;
    }

    h1, h2, h3 { margin: 0 0 10px 0; }

    .catalogue-page { display: flex; flex-direction: column; padding: 20px; }
    .catalogue-header { text-align: center; margin-bottom: 30px; }
    .catalogue-content { display: flex; gap: 20px; }

    /* Sidebar Filters */
    .filters {
      width: 250px;
      background-color: #305F72;
      color: #F2EFED;
      padding: 15px;
      border-radius: 10px;
    }

    .reset-btn {
      background-color: #B87332;
      border: none;
      padding: 8px 12px;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    .filter-list { list-style: none; padding: 0; }
    .filter-list li { margin-bottom: 15px; }
    .dropdown-item {
      display: block;
      background-color: #7DA0AE;
      border: none;
      padding: 6px 10px;
      margin-bottom: 5px;
      cursor: pointer;
      border-radius: 5px;
      color: #F2EFED;
      text-align: left;
      width: 100%;
    }
    .dropdown-item.active { background-color: #B87332; }

    /* Coin List */
    .catalogue-list-section { flex: 1; }
    .coin-list { display: flex; flex-direction: column; gap: 20px; }
    .coin-row-list {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #305F72;
      color: #F2EFED;
      padding: 10px;
      border-radius: 10px;
    }
    .coin-info-list { display: flex; gap: 15px; align-items: center; }
    .coin-img-list { width: 80px; height: 80px; object-fit: contain; border-radius: 5px; background-color: white; }
    .coin-text-list p { margin: 5px 0 0 0; }
    .btn-product-view {
      background-color: #B87332;
      padding: 8px 15px;
      border-radius: 5px;
      color: #F2EFED;
      text-decoration: none;
      font-weight: bold;
    }
    .btn-product-view:hover { background-color: #7DA0AE; }
    .load-more-wrapper { text-align: center; margin: 20px 0; }
    .load-more {
      background-color: #B87332;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      color: #F2EFED;
      cursor: pointer;
      font-weight: bold;
    }
    .load-more:hover { background-color: #7DA0AE; }
    .back-to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 15px;
      background-color: #B87332;
      border: none;
      border-radius: 5px;
      color: #F2EFED;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <div class="catalogue-page">
    <div class="catalogue-header">
      <h1>PRODUCT CATALOGUE</h1>
    </div>

    <div class="catalogue-content">

      <!-- Sidebar Filters -->
      <aside class="filters">
        <h2>Filter By</h2>
        <button class="reset-btn">Reset Filters</button>
        <ul class="filter-list">
          <li>
            <h3>Metal</h3>
            <button class="dropdown-item">Gold</button>
            <button class="dropdown-item">Silver</button>
            <button class="dropdown-item">Bronze</button>
            <button class="dropdown-item">Copper</button>
          </li>
          <li>
            <h3>Theme</h3>
            <button class="dropdown-item">Legends, Kings, Women, Seals</button>
            <button class="dropdown-item">Gods and goddesses</button>
          </li>
          <li>
            <h3>Country</h3>
            <button class="dropdown-item">United Kingdom</button>
            <button class="dropdown-item">Argentina</button>
          </li>
          <li>
            <h3>Shape</h3>
            <button class="dropdown-item">Circular</button>
            <button class="dropdown-item">Heptagonal</button>
            <button class="dropdown-item">Octagonal</button>
          </li>
        </ul>
      </aside>

      <!-- Coin List -->
      <div class="catalogue-list-section">
        <div class="coin-list">
          <!-- Example Coins -->
          <div class="coin-row-list">
            <div class="coin-info-list">
              <img src="../assets/coin.png" alt="Roman Denarius" class="coin-img-list">
              <div class="coin-text-list">
                <h3>Roman Denarius</h3>
                <p>Ancient Rome coin from 50 BC.</p>
              </div>
            </div>
            <a href="product.html" class="btn-product-view">View</a>
          </div>

          <div class="coin-row-list">
            <div class="coin-info-list">
              <img src="../assets/coin.png" alt="Greek Drachma" class="coin-img-list">
              <div class="coin-text-list">
                <h3>Greek Drachma</h3>
                <p>Ancient Greece coin from 100 BC.</p>
              </div>
            </div>
            <a href="product.html" class="btn-product-view">View</a>
          </div>

          <div class="coin-row-list">
            <div class="coin-info-list">
              <img src="../assets/coin.png" alt="Shop All Coins" class="coin-img-list">
              <div class="coin-text-list">
                <h3>View All Coins</h3>
                <p>Explore our full catalog</p>
              </div>
            </div>
            <a href="shop.html" class="btn-product-view">Shop →</a>
          </div>
        </div>

        <div class="load-more-wrapper">
          <button class="load-more">Load more...</button>
        </div>
      </div>
    </div>

    <button class="back-to-top" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">↑ Top</button>
  </div>

  <!-- Footer -->
  <div id="footer"></div>

  <!-- Load Navbar and Footer Dynamically & Filter Script -->
  <script>
    // Navbar and footer
    fetch('../components/navbar.html')
      .then(res => res.text())
      .then(html => document.getElementById('navbar').innerHTML = html)
      .catch(err => console.error('Error loading navbar:', err));

    fetch('../components/footer.html')
      .then(res => res.text())
      .then(html => document.getElementById('footer').innerHTML = html)
      .catch(err => console.error('Error loading footer:', err));

    // Filter button toggle
    const filterButtons = document.querySelectorAll('.dropdown-item');
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('active');
        // Here you can add logic to filter coins dynamically
        console.log('Filter clicked:', btn.textContent, 'Active:', btn.classList.contains('active'));
      });
    });

    // Reset filters
    const resetBtn = document.querySelector('.reset-btn');
    resetBtn.addEventListener('click', () => {
      filterButtons.forEach(btn => btn.classList.remove('active'));
    });
  </script>

</body>
</html>
