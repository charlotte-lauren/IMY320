<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - CurioCrow</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/Navbar.css">
<link rel="stylesheet" href="../css/Footer.css">
<link rel="stylesheet" href="../css/ConfirmationPage.css">
<style>
  /* Two-panel layout */
  .checkout-container {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    /* margin: 2rem; */
    margin: 4rem auto;
    width: 80%;
    color: #1A1F2B;
  }
  .order-summary, .checkout-form-container {
    flex: 1;
    min-width: 300px;
    padding: 0 2rem 2rem 2rem;
    gap: 1rem;
    background-color: #e7e7e7;
  }
  .order-summary h2, .checkout-form-container h2 {
    margin-bottom: 1rem;
  }
  .order-summary {
    height: 100%;
  }
  .cart-item {
    display: flex;
    margin-bottom: 1rem;
    /* border-bottom: 1px solid #ddd; */
    padding-bottom: 0.5rem;
  }
  .cart-item img {
    width: 60px;
    height: 60px;
    object-fit: contain;
    margin-right: 1rem;
    border-radius: 999px;
  }
  .cart-item-details h4 {
    margin: 0 0 0.25rem 0;
  }
  .cart-item-details p {
    margin: 0;
    font-size: 0.9rem;
  }
  .checkout-form label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 1rem;
    color: #1A1F2B;
  }
  legend {
    margin-bottom: 0.5rem;
    font-size: 1.2rem;
    color: #305F72;
  }
  fieldset {
    margin-top: 1rem;
    border-radius: 1rem;
    border: 2px solid #305F72;

  }
  .checkout-form input {
    width: 100%;
    padding: 0.5rem;
    margin-bottom: 1rem;
    margin-top: 0.5rem;
    background-color: transparent;
    border: 2px solid #1A1F2B;
        color: #1A1F2B;
    font-size: 1rem;
  padding: 0.75rem 1rem;
  border-radius: 999px;
  }
  .checkout-form input:focus {
      box-shadow: 0 0 0 2px #B87332; /* subtle orange border glow */
  border: 2px solid #B87332;
  outline: none;
  }
  .checkout-submit {
    display: block;
    width: 100%;
    padding: 0.75rem;
    font-size: 1rem;
    margin-top: 2rem;
  }
</style>
</head>
<body>

<!-- Navbar -->
<div id="navbar"></div>

<div class="checkout-page">
  <div class="header-content">
    <h1>Checkout</h1>
    <p>This is a simulation; no data is saved.</p>
  </div>


  <div class="checkout-container">
    <!-- Left Panel: Order Summary -->
    <div class="order-summary">
      <h2>Your Order</h2>
      <div id="orderList"></div>
      <h3 id="orderTotal"></h3>
    </div>

    <!-- Right Panel: Form -->
    <div class="checkout-form-container">
      <h2>Shipping & Payment</h2>
      <form id="checkoutForm" class="checkout-form">
        <fieldset>
          <legend>Shipping Information</legend>
          <label>Full Name:<input type="text" name="Fullname" required></label>
          <label>Address Line 1:<input type="text" name="Address1" required></label>
          <label>Address Line 2:<input type="text" name="Address2"></label>
          <label>City:<input type="text" name="city" required></label>
          <label>State / Province:<input type="text" name="Province" required></label>
          <label>Postal Code:<input type="text" name="Zip" required></label>
          <label>Country:<input type="text" name="Country" required></label>
        </fieldset>

        <fieldset>
          <legend>Payment Information</legend>
          <label>Cardholder Name:<input type="text" name="Cardname" required></label>
          <label>Card Number:<input type="text" name="Cardnumber" required pattern="\d{13,19}" placeholder="13-19 digits"></label>
          <label>Expiry Date:<input type="month" name="Expiry" required></label>
          <label>CVV:<input type="text" name="Cvv" required pattern="\d{3,4}" placeholder="3-4 digits"></label>
        </fieldset>

        <button type="submit" class="btn checkout-submit">Place Order</button>
      </form>
    </div>
  </div>
</div>

<!-- Footer -->
<div id="footer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvgqnAgdSQeGpgTMRMOvcaxB7fD8XbETk",
  authDomain: "curiocrow.firebaseapp.com",
  projectId: "curiocrow",
  storageBucket: "curiocrow.appspot.com",
  messagingSenderId: "570380745141",
  appId: "1:570380745141:web:9df2526ec09b3f634e41fc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// ----------------- Navbar & Footer -----------------
fetch('../components/navbar.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('navbar').innerHTML = html;
    setupNavbar();
  });

fetch('../components/footer.html')
  .then(res => res.text())
  .then(html => { document.getElementById('footer').innerHTML = html; });

function setupNavbar() {
  const profileIcon = document.getElementById('profileIcon');
  const dropdownMenu = document.querySelector('.dropdown-menu');
  const searchForm = document.getElementById('searchForm');
  const searchInput = document.getElementById('searchInput');
  if (!profileIcon || !dropdownMenu || !searchForm || !searchInput) return;

  profileIcon.addEventListener('click', e => { e.stopPropagation(); dropdownMenu.classList.toggle('show'); });
  dropdownMenu.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => dropdownMenu.classList.remove('show'));

  onAuthStateChanged(auth, user => {
    dropdownMenu.innerHTML = '';
    if (user) {
      profileIcon.src = user.photoURL || '../assets/UserIcon.png';
      dropdownMenu.innerHTML = `
        <a href="../pages/profile.html" class="dropdown-item dropdown-item-profile">Profile</a>
        <button class="btn dropdown-item" id="logoutBtn">Logout</button>
      `;
      dropdownMenu.querySelector('#logoutBtn').addEventListener('click', async () => {
        await signOut(auth);
        localStorage.clear();
        window.location.href = "../index.html";
      });
    } else {
      profileIcon.src = '../assets/UserIcon.png';
      dropdownMenu.innerHTML = `<a href="../pages/login.html" class="dropdown-item dropdown-item-profile">Login</a>`;
    }
  });

  searchForm.addEventListener('submit', e => {
    e.preventDefault();
    const query = searchInput.value.trim();
    if (!query) return;
    window.location.href = `../pages/coins.html?search=${encodeURIComponent(query)}`;
  });
}

// ----------------- Render Cart / Order -----------------
function renderOrder() {
  const orderList = document.getElementById('orderList');
  const orderTotal = document.getElementById('orderTotal');
  const cart = JSON.parse(localStorage.getItem('checkoutCart') || '[]');

  if (!cart.length) {
    orderList.innerHTML = '<p>Your cart is empty.</p>';
    orderTotal.textContent = '';
    return;
  }

  let total = 0;
  orderList.innerHTML = '';

  cart.forEach(item => {
    const quantity = item.quantity || 1;
    const itemTotal = (Number(item.FaceValue) || 0) * quantity;
    total += itemTotal;

    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `
      <img src="${item.img || 'coin.png'}" alt="${item.Name}">
      <div class="cart-item-details">
        <h4>${item.Name} ${quantity > 1 ? `×${quantity}` : ''}</h4>
        <p>${item.Country}</p>
        <p>${item.FaceValue || 0} ${item.Currency || ''}</p>
      </div>
    `;
    orderList.appendChild(div);
  });

  orderTotal.textContent = `Total: ${total.toFixed(2)}`;
}

// ----------------- Checkout Form Submission -----------------
const checkoutForm = document.getElementById('checkoutForm');

checkoutForm.addEventListener('submit', e => {
  e.preventDefault();

  // Collect shipping info
  const shippingData = Object.fromEntries(new FormData(checkoutForm).entries());

  // Get current cart
  const cart = JSON.parse(localStorage.getItem('cart') || '[]');

  // Save to localStorage for confirmation page
  localStorage.setItem('checkoutShipping', JSON.stringify(shippingData));
  localStorage.setItem('checkoutCart', JSON.stringify(cart));

  // Redirect to confirmation page
  window.location.href = 'load.html';
});


// ----------------- Check Auth & Render -----------------
onAuthStateChanged(auth, user => {
  if (!user) {
    document.body.innerHTML = '<p class="not-logged-in" style="text-align:center; margin-top:50px;">Please log in to checkout.</p>';
    return;
  }
  renderOrder();
});
</script>

</body>
</html>
