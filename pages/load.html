<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processing Order - CurioCrow</title>
<link rel="stylesheet" href="../css/global.css">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: #F2EFED;
    font-family: Arial, sans-serif;
    color: #1A1F2B;
  }
  .loading-container {
    text-align: center;
  }
  .spinner {
    margin: 2rem auto;
    width: 70px;
    height: 70px;
    border: 8px solid #1A1F2B;
    border-top: 8px solid #B87332;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .loading-text {
    font-size: 1.25rem;
    margin-top: 1rem;
  }
</style>
</head>
<body>

  <div class="err-container">
              <img src="../assets/yay.png" alt="Log in please image" class="error-image">
              <h3 class="err-msg">YAY your order was successful!</h3>
              <!-- <h4 class="err-sub"> Please log in to view your seller page. </h4> -->
              <!-- <a href="../pages/login.html" class="btn err-btn">Log in</a> -->
            <!-- </div> -->

<!-- <div class="loading-container"> -->
  <div class="spinner"></div>
  <p class="loading-text">Processing your order... Please wait</p>
</div>

<script>
// Pick random wait time between 30s and 90s
const minTime = 5000;   // 5 seconds
const maxTime = 30000;   // 30 minutes
const waitTime = Math.floor(Math.random() * (maxTime - minTime + 1)) + minTime;

// Redirect after wait
setTimeout(() => {
  window.location.href = "confirmed.html"; // where to send them after
}, waitTime);
</script>

</body>
</html>
