<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Details - CurioCrow</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/Navbar.css">
  <link rel="stylesheet" href="../css/Footer.css">
  <link rel="stylesheet" href="../css/ProductPage.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #F2EFED;
      color: #1A1F2B;
    }

    .product-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      color: #F2EFED;
      background-color: #B87332;
      cursor: pointer;
      margin: 5px 0;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover { background-color: #7DA0AE; }
    .tertiary { background-color: #305F72; }

    .product-content {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }

    .coin-image img {
      max-width: 300px;
      width: 100%;
      border-radius: 10px;
    }

    .coin-details {
      flex: 1;
      min-width: 300px;
    }

    .coin-title { margin-top: 0; }
    .coin-attributes { margin: 15px 0; }
    .attribute { margin-bottom: 5px; }

    .buttons { margin-top: 15px; }

    .back-link {
      display: inline-block;
      margin-bottom: 15px;
      color: #305F72;
      text-decoration: none;
    }

    .back-link:hover { color: #B87332; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <div class="product-page">

    <a href="coins.html" class="back-link">← Back to Catalogue</a>

    <div class="product-page-section">
      <div class="product-content">

        <div class="coin-image">
          <img src="../assets/coin.png" alt="Roman Denarius">
        </div>

        <div class="coin-details">
          <h1 class="coin-title">Roman Denarius</h1>
          <p>An ancient Roman silver coin from 50 BC. Perfect for collectors seeking historical value.</p>
          <p><strong>Price:</strong> 100 USD</p>

          <div class="coin-attributes">
            <div class="attribute"><strong>Country:</strong> Rome</div>
            <div class="attribute"><strong>Metal:</strong> Silver</div>
            <div class="attribute"><strong>Era:</strong> 50 BC</div>
            <div class="attribute"><strong>Weight:</strong> 3.5 g</div>
            <div class="attribute"><strong>Diameter:</strong> 18 mm</div>
          </div>

          <div class="buttons">
            <button class="btn add-to-collection" onclick="alert('Added to your collection!')">Add to Collection</button>
            <button class="btn add-to-wishlist" onclick="alert('Added to wishlist!')">Add to Wishlist</button>
          </div>

        </div>

      </div>
    </div>

  </div>

  <!-- Footer -->
  <div id="footer"></div>

  <!-- Load Navbar and Footer Dynamically -->
  <script>
    fetch('../components/navbar.html')
      .then(res => res.text())
      .then(html => document.getElementById('navbar').innerHTML = html)
      .catch(err => console.error('Error loading navbar:', err));

    fetch('../components/footer.html')
      .then(res => res.text())
      .then(html => document.getElementById('footer').innerHTML = html)
      .catch(err => console.error('Error loading footer:', err));
  </script>

</body>
</html>
