<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Details - CurioCrow</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/Navbar.css">
<link rel="stylesheet" href="../css/Footer.css">
<link rel="stylesheet" href="../css/ProductPage.css">
</head>
<body>

<!-- Navbar -->
<div id="navbar"></div>

<div class="product-page">
  <a href="coins.html" class="back-link">← Back to Catalogue</a>

  <div class="product-page-section">
    <div class="product-content">

      <div class="coin-image">
        <img src="../assets/coin.png" alt="Coin Image">
      </div>

      <div class="coin-details">
        <h1 class="coin-title">Loading...</h1>
        <p class="coin-description"></p>
        <p><strong>Price:</strong> <span class="coin-price"></span></p>

        <div class="coin-attributes">
          <div class="attribute"><strong>Country:</strong> <span class="coin-country"></span></div>
          <div class="attribute"><strong>Series:</strong> <span class="coin-series"></span></div>
          <div class="attribute"><strong>Shape:</strong> <span class="coin-shape"></span></div>
          <div class="attribute"><strong>Metal:</strong> <span class="coin-metal"></span></div>
          <div class="attribute"><strong>Era:</strong> <span class="coin-era"></span></div>
        </div>

        <div class="buttons">
          <button class="btn add-to-collection">Add to Collection</button>
          <button class="btn add-to-wishlist">Add to Wishlist</button>
        </div>

      </div>

    </div>
  </div>

</div>

<!-- Footer -->
<div id="footer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAvgqnAgdSQeGpgTMRMOvcaxB7fD8XbETk",
  authDomain: "curiocrow.firebaseapp.com",
  projectId: "curiocrow",
  storageBucket: "curiocrow.appspot.com",
  messagingSenderId: "570380745141",
  appId: "1:570380745141:web:9df2526ec09b3f634e41fc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---------------- Navbar & Footer ----------------
fetch('../components/navbar.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('navbar').innerHTML = html;
    const userDropdown = document.querySelector('.user-dropdown');
    const dropdownMenu = userDropdown.querySelector('.dropdown-menu');
    const profileIcon = userDropdown.querySelector('img');

    if (!userDropdown || !dropdownMenu || !profileIcon) return;

    onAuthStateChanged(auth, user => {
      dropdownMenu.innerHTML = '';
      if (user) {
        profileIcon.src = user.photoURL || '../assets/UserIcon.png';
        dropdownMenu.innerHTML = `
          <a href="profile.html" class="dropdown-item">Profile</a>
          <button class="btn dropdown-item" id="logoutBtn">Logout</button>
        `;
        dropdownMenu.querySelector('#logoutBtn').addEventListener('click', async () => {
          await signOut(auth);
          window.location.href = "../index.html";
        });
      } else {
        profileIcon.src = '../assets/UserIcon.png';
        dropdownMenu.innerHTML = `<a href="login.html" class="dropdown-item">Login</a>`;
      }
    });

    profileIcon.addEventListener('click', e => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('show');
    });
    document.addEventListener('click', () => dropdownMenu.classList.remove('show'));
    dropdownMenu.addEventListener('click', e => e.stopPropagation());
  });

fetch('../components/footer.html')
  .then(r => r.text())
  .then(html => document.getElementById('footer').innerHTML = html);

// ---------------- Load Coin Data ----------------
function getCoinIdFromURL() {
  return new URLSearchParams(window.location.search).get('id');
}

async function loadCoin() {
  const coinId = getCoinIdFromURL();
  if (!coinId) {
    alert("Coin ID missing in URL");
    return;
  }

  const coinRef = doc(db, "coins", coinId);
  const coinSnap = await getDoc(coinRef);

  if (!coinSnap.exists()) {
    alert("Coin not found");
    return;
  }

  const coin = coinSnap.data();

  // Image
  const coinImg = document.querySelector('.coin-image img');
  coinImg.src = coin.Link || '../assets/coin.png';
  coinImg.alt = coin.Name || 'Coin Image';

  // Basic info
  document.querySelector('.coin-title').textContent = coin.Name || 'Unknown Coin';
  document.querySelector('.coin-description').textContent = coin.Description || '';
  document.querySelector('.coin-price').textContent = coin.FaceValue || '';

  // Attributes
  document.querySelector('.coin-country').textContent = coin.Country || '';
  document.querySelector('.coin-series').textContent = coin.Series || '';
  document.querySelector('.coin-shape').textContent = coin.Shape || '';
  document.querySelector('.coin-metal').textContent = coin.MetalComposition ? coin.MetalComposition.join(', ') : '';
  
  // Only show Era if it's a valid number/string
  const era = coin.IssuedOn;
  document.querySelector('.coin-era').textContent = (!isNaN(era) && era) ? era : '';
}

// ---------------- Collection / Wishlist ----------------
function getCoinFromPage() {
  return {
    _id: getCoinIdFromURL(),
    Name: document.querySelector('.coin-title').textContent,
    Country: document.querySelector('.coin-country').textContent,
    Series: document.querySelector('.coin-series').textContent,
    Shape: document.querySelector('.coin-shape').textContent,
    MetalComposition: document.querySelector('.coin-metal').textContent.split(',').map(m => m.trim()),
    Description: document.querySelector('.coin-description').textContent,
    FaceValue: document.querySelector('.coin-price').textContent,
    Currency: 'USD',
    img: document.querySelector('.coin-image img').src,
    quantity: 1
  };
}

onAuthStateChanged(auth, user => {
  const addToCollectionBtn = document.querySelector('.add-to-collection');
  const addToWishlistBtn = document.querySelector('.add-to-wishlist');

  if (!user) {
    addToCollectionBtn.disabled = true;
    addToWishlistBtn.disabled = true;
    return;
  }

  function addItem(storageKey) {
    const coin = getCoinFromPage();
    let items = JSON.parse(localStorage.getItem(storageKey)) || [];
    const existing = items.find(c => c._id === coin._id);
    if (existing) existing.quantity += 1;
    else items.push(coin);
    localStorage.setItem(storageKey, JSON.stringify(items));
  }

  addToCollectionBtn.addEventListener('click', () => {
    addItem('cart');
    alert('Coin added to your collection!');
  });

  addToWishlistBtn.addEventListener('click', () => {
    addItem('wishlist');
    alert('Coin added to your wishlist!');
  });
});

loadCoin();
</script>

</body>
</html>
